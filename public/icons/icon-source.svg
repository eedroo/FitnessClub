<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do FitnessClub: placa de grafite escovado com um haltere em prata polida. Fundo cheio (o iOS arredonda). -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4E57"/>
      <stop offset="0.45" stop-color="#2A2D33"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.36" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="brush" width="512" height="3" patternUnits="userSpaceOnUse">
      <rect width="512" height="1" fill="#FFFFFF" opacity="0.025"/>
    </pattern>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#C9CED6"/>
      <stop offset="0.55" stop-color="#8C929D"/>
      <stop offset="0.72" stop-color="#E4E7EC"/>
      <stop offset="1" stop-color="#9AA0AB"/>
    </linearGradient>
    <linearGradient id="silverBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5F7"/>
      <stop offset="0.5" stop-color="#9AA0AB"/>
      <stop offset="1" stop-color="#D5D9DF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#plate)"/>
  <rect width="512" height="512" fill="url(#brush)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <g filter="url(#drop)" transform="rotate(-30 256 256)">
    <rect x="166" y="241" width="180" height="30" rx="8" fill="url(#silverBar)"/>
    <rect x="128" y="174" width="44" height="164" rx="14" fill="url(#silver)"/>
    <rect x="340" y="174" width="44" height="164" rx="14" fill="url(#silver)"/>
    <rect x="94" y="206" width="30" height="100" rx="11" fill="url(#silver)"/>
    <rect x="388" y="206" width="30" height="100" rx="11" fill="url(#silver)"/>
  </g>
</svg>
